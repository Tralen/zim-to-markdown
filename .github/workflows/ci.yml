name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: '9.6.7'
          - os: ubuntu-22.04
            ghc: '9.14.1'
          - os: macos-15
            ghc: '9.14.1'
          - os: windows-latest
            ghc: '9.14.1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.18.1.0'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
      - name: Update package index
        run: cabal update
      - name: Build
        run: cabal build all --enable-tests
      - name: Test
        run: cabal test all
      - name: Check package metadata
        run: cabal check
      - name: Build source distribution
        run: cabal sdist
      - name: Build Haddock documentation
        if: matrix.os == 'ubuntu-22.04' && matrix.ghc == '9.14.1'
        run: cabal haddock --haddock-for-hackage

  lint:
    name: HLint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up HLint
        uses: haskell-actions/hlint-setup@fe9cd1cd1af94a23900c06738e73f6ddb092966a # v2
        with:
          version: '3.10'
      - name: Run HLint
        uses: haskell-actions/hlint-run@eaca4cfbf4a69f4eb875df38b6bc3e1657020378 # v2
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: suggestion

  format:
    name: Fourmolu
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Fourmolu
        run: |
          curl -sL https://github.com/fourmolu/fourmolu/releases/download/v0.21.0.0/fourmolu-0.21.0.0-linux-x86_64.zip -o fourmolu.zip
          echo "aadf6931653df7b96f52014cf8eb4285a3e8778cd0b531499fc3ee013e1e00c7  fourmolu.zip" | sha256sum -c -
          unzip -q fourmolu.zip
      - name: Check formatting
        run: ./fourmolu-0.21.0.0-linux-x86_64/fourmolu --mode check src app test

  secrets:
    name: Secret scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
