name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: GHC ${{ matrix.ghc }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: '9.6.7'
          - os: ubuntu-22.04
            ghc: '9.14.1'
          - os: macos-15
            ghc: '9.14.1'
          - os: windows-latest
            ghc: '9.14.1'
    steps:
      - uses: actions/checkout@v5
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.18.1.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-${{ matrix.ghc }}-${{ hashFiles('**/*.cabal', 'cabal.project', 'cabal.project.freeze') }}
      - name: Update package index
        run: cabal update
      - name: Build
        run: cabal build all --enable-tests
      - name: Test
        run: cabal test all
      - name: Check package metadata
        run: cabal check
      - name: Build source distribution
        run: cabal sdist
      - name: Build Haddock documentation
        if: matrix.os == 'ubuntu-22.04' && matrix.ghc == '9.14.1'
        run: cabal haddock --haddock-for-hackage

  lint:
    name: HLint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: '3.10'
      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: suggestion

  secrets:
    name: Secret scan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
