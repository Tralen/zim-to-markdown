name: Release binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload assets to
        required: true
        type: string
      publish:
        description: Attach artifacts, checksums, and attestations to the GitHub release
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: '9.14.1'
          - os: macos-15
            ghc: '9.14.1'
          - os: windows-latest
            ghc: '9.14.1'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}

      - name: Set up Haskell
        uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.18.1.0'

      - name: Update package index
        shell: bash
        run: cabal update

      - name: Build and test
        shell: bash
        run: |
          cabal build all
          cabal test all

      - name: Package binary
        shell: bash
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          VERSION="${TAG_NAME#v}"
          PLATFORM="${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir -p dist/release
          cabal install exe:zim-to-markdown --installdir=dist/release --install-method=copy --overwrite-policy=always
          cp README.md LICENSE CHANGELOG.md dist/release/
          cd dist/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="zim-to-markdown-${VERSION}-${PLATFORM}.zip"
            7z a "../${ASSET}" *
          else
            ASSET="zim-to-markdown-${VERSION}-${PLATFORM}.tar.gz"
            tar -czf "../${ASSET}" *
          fi
          echo "ASSET_PATH=dist/${ASSET}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zim-to-markdown-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.ASSET_PATH }}

      - name: Attest build provenance
        if: inputs.publish
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ASSET_PATH }}

      - name: Attach to GitHub release
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "zim-to-markdown ${TAG_NAME#v}" --generate-notes
          gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber

  checksums:
    name: Publish checksums
    needs: build
    if: inputs.publish
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.release_tag }}
        run: gh release upload "$TAG_NAME" artifacts/SHA256SUMS --clobber
