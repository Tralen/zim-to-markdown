name: Release binaries

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and upload assets to
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            ghc: '9.14.1'
          - os: macos-15
            ghc: '9.14.1'
          - os: windows-latest
            ghc: '9.14.1'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.release_tag }}

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: '3.18.1.0'

      - name: Update package index
        shell: bash
        run: cabal update

      - name: Build and test
        shell: bash
        run: |
          cabal build all
          cabal test all

      - name: Package binary
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.release_tag }}
        run: |
          VERSION="${TAG_NAME#v}"
          PLATFORM="${RUNNER_OS}-${RUNNER_ARCH}"
          mkdir -p dist/release
          cabal install exe:zim-to-markdown --installdir=dist/release --install-method=copy --overwrite-policy=always
          cp README.md LICENSE CHANGELOG.md dist/release/
          cd dist/release
          if [ "$RUNNER_OS" = "Windows" ]; then
            ASSET="zim-to-markdown-${VERSION}-${PLATFORM}.zip"
            7z a "../${ASSET}" *
          else
            ASSET="zim-to-markdown-${VERSION}-${PLATFORM}.tar.gz"
            tar -czf "../${ASSET}" *
          fi
          echo "ASSET_PATH=dist/${ASSET}" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: zim-to-markdown-${{ runner.os }}-${{ runner.arch }}
          path: ${{ env.ASSET_PATH }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ASSET_PATH }}

      - name: Attach to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.release_tag }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --title "zim-to-markdown ${TAG_NAME#v}" --generate-notes
          gh release upload "$TAG_NAME" "$ASSET_PATH" --clobber

  checksums:
    name: Publish checksums
    needs: build
    runs-on: ubuntu-22.04
    environment: release
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS

      - name: Upload checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.event.inputs.release_tag }}
        run: gh release upload "$TAG_NAME" artifacts/SHA256SUMS --clobber
